        // ========================================
        // SPRITE ENGINE - PIXEL ART DRAWING
        // ========================================
        class SpriteEngine {
            constructor(ctx) {
                this.ctx = ctx;
            }

            // Draw a pixel
            pixel(x, y, color) {
                const size = GameConfig.PIXEL_SIZE;
                this.ctx.fillStyle = color;
                this.ctx.fillRect(x * size, y * size, size, size);
            }

            // Draw a rectangle
            rect(x, y, w, h, color) {
                for (let i = 0; i < w; i++) {
                    for (let j = 0; j < h; j++) {
                        this.pixel(x + i, y + j, color);
                    }
                }
            }

            // Draw a circle
            circle(cx, cy, radius, color) {
                for (let x = -radius; x <= radius; x++) {
                    for (let y = -radius; y <= radius; y++) {
                        if (x * x + y * y <= radius * radius) {
                            this.pixel(cx + x, cy + y, color);
                        }
                    }
                }
            }

            // Draw Dubai Cookie
            drawCookie(x, y, size = 10) {
                // Outer dough
                this.circle(x, y, size, GameConfig.COLORS.cookieDough);

                // Crust details
                for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 6) {
                    const px = Math.cos(angle) * (size - 2);
                    const py = Math.sin(angle) * (size - 2);
                    this.circle(x + px, y + py, 2, GameConfig.COLORS.cookieCrust);
                }

                // Pistachio filling in center (oozing effect)
                this.circle(x, y, size - 4, GameConfig.COLORS.pistachioFilling);

                // Dark pistachio chunks
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2;
                    const px = Math.cos(angle) * (size - 5);
                    const py = Math.sin(angle) * (size - 5);
                    this.pixel(x + px, y + py, GameConfig.COLORS.pistachioDeep);
                }

                // Kadayif strands on top
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const px = Math.cos(angle) * size;
                    const py = Math.sin(angle) * size;
                    this.pixel(x + px, y + py, GameConfig.COLORS.kadayif);
                }
            }

            // Draw Oven
            drawOven(x, y, isOn = false) {
                // Oven body
                this.rect(x, y, 20, 16, GameConfig.COLORS.oven);

                // Window
                this.rect(x + 4, y + 3, 12, 8, '#222');

                // Fire glow if on
                if (isOn) {
                    this.rect(x + 5, y + 8, 10, 2, GameConfig.COLORS.ovenFire);
                    this.rect(x + 6, y + 7, 8, 1, '#FF6347');
                }

                // Door handle
                this.rect(x + 18, y + 7, 1, 3, '#888');

                // Control knobs
                this.pixel(x + 2, y + 14, '#444');
                this.pixel(x + 6, y + 14, '#444');
                this.pixel(x + 10, y + 14, '#444');
            }

            // Draw Customer
            drawCustomer(x, y, emotion = 'neutral') {
                // Body
                this.rect(x, y + 6, 8, 10, '#4169E1'); // Shirt

                // Head
                this.circle(x + 4, y + 3, 4, GameConfig.COLORS.customer);

                // Eyes
                this.pixel(x + 2, y + 2, '#000');
                this.pixel(x + 6, y + 2, '#000');

                // Mouth based on emotion
                if (emotion === 'happy') {
                    this.pixel(x + 2, y + 5, '#000');
                    this.pixel(x + 3, y + 6, '#000');
                    this.pixel(x + 5, y + 6, '#000');
                    this.pixel(x + 6, y + 5, '#000');
                } else if (emotion === 'angry') {
                    this.pixel(x + 2, y + 6, '#000');
                    this.pixel(x + 3, y + 5, '#000');
                    this.pixel(x + 5, y + 5, '#000');
                    this.pixel(x + 6, y + 6, '#000');
                } else {
                    this.rect(x + 2, y + 5, 4, 1, '#000');
                }

                // Arms
                this.rect(x - 1, y + 8, 2, 4, GameConfig.COLORS.customer);
                this.rect(x + 7, y + 8, 2, 4, GameConfig.COLORS.customer);
            }

            // Draw Kadayif strands
            drawKadayif(x, y) {
                const strands = 8;
                for (let i = 0; i < strands; i++) {
                    const offset = Math.sin(Date.now() / 200 + i) * 2;
                    this.rect(x + i * 2, y + offset, 1, 10, GameConfig.COLORS.kadayif);
                }
            }

            // Draw Pistachio
            drawPistachio(x, y) {
                // Nut body
                this.circle(x, y, 4, '#C4A35A');

                // Green kernel
                this.circle(x, y, 2, GameConfig.COLORS.pistachioFilling);

                // Shell crack
                this.rect(x - 1, y - 3, 1, 6, '#8B7355');
            }

            // Draw Filling bowl
            drawFilling(x, y) {
                // Bowl
                this.rect(x, y + 4, 12, 6, '#8B4513');
                this.rect(x + 1, y + 5, 10, 4, GameConfig.COLORS.pistachioFilling);

                // Pistachio chunks
                this.pixel(x + 3, y + 6, GameConfig.COLORS.pistachioDeep);
                this.pixel(x + 6, y + 7, GameConfig.COLORS.pistachioDeep);
                this.pixel(x + 9, y + 6, GameConfig.COLORS.pistachioDeep);
            }

            // Draw Dough
            drawDough(x, y) {
                // Dough ball
                this.circle(x, y, 5, GameConfig.COLORS.cookieDough);

                // Texture
                this.pixel(x - 2, y - 1, GameConfig.COLORS.cookieCrust);
                this.pixel(x + 1, y + 2, GameConfig.COLORS.cookieCrust);
                this.pixel(x - 1, y + 1, GameConfig.COLORS.cookieCrust);
            }

            // Draw Money coin
            drawMoney(x, y) {
                // Coin
                this.circle(x, y, 4, GameConfig.COLORS.money);

                // Won symbol
                this.pixel(x - 1, y - 1, '#DAA520');
                this.pixel(x + 1, y - 1, '#DAA520');
                this.pixel(x, y, '#DAA520');
                this.pixel(x - 1, y + 1, '#DAA520');
                this.pixel(x + 1, y + 1, '#DAA520');
            }

            // Draw background scene
            drawBackground() {
                const ctx = this.ctx;
                const width = ctx.canvas.width / GameConfig.PIXEL_SIZE;
                const height = ctx.canvas.height / GameConfig.PIXEL_SIZE;

                // Sky gradient
                for (let y = 0; y < height / 2; y++) {
                    const ratio = y / (height / 2);
                    const r = Math.floor(15 + ratio * 20);
                    const g = Math.floor(52 + ratio * 30);
                    const b = Math.floor(96 + ratio * 20);
                    this.rect(0, y, width, 1, `rgb(${r},${g},${b})`);
                }

                // Floor
                this.rect(0, height / 2, width, height / 2, '#2C1810');

                // Floor tiles
                for (let x = 0; x < width; x += 10) {
                    for (let y = height / 2; y < height; y += 10) {
                        if ((x + y) % 20 === 0) {
                            this.rect(x, y, 10, 10, '#3D2817');
                        }
                    }
                }
            }

            // Draw shop counter
            drawCounter(x, y) {
                // Counter surface
                this.rect(x, y, 60, 8, '#8B4513');

                // Counter front
                this.rect(x, y + 8, 60, 12, '#654321');

                // Decorative line
                this.rect(x, y + 7, 60, 1, '#A0522D');

                // Display case
                this.rect(x + 5, y - 15, 20, 15, 'rgba(200,200,200,0.3)');
                this.rect(x + 5, y - 15, 20, 1, '#888');
                this.rect(x + 5, y - 1, 20, 1, '#888');
            }
        }

        // ========================================
        // AUDIO ENGINE - WEB AUDIO API
        // ========================================
        class AudioEngine {
            constructor() {
                this.audioContext = null;
                this.masterGain = null;
                this.init();
            }

            init() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.audioContext.createGain();
                    this.masterGain.gain.value = GameConfig.MASTER_VOLUME;
                    this.masterGain.connect(this.audioContext.destination);
                } catch (e) {
                    console.warn('Web Audio API not supported');
                }
            }

            // Play click sound
            playClick() {
                if (!this.audioContext) return;

                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.frequency.value = 800;
                gain.gain.value = 0.1;

                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
                osc.stop(this.audioContext.currentTime + 0.1);
            }

            // Play money sound
            playMoney() {
                if (!this.audioContext) return;

                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.frequency.value = 1200;
                osc.type = 'sine';
                gain.gain.value = 0.15;

                osc.start();
                osc.frequency.exponentialRampToValueAtTime(1500, this.audioContext.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                osc.stop(this.audioContext.currentTime + 0.2);
            }

            // Play success sound
            playSuccess() {
                if (!this.audioContext) return;

                const notes = [523, 659, 784]; // C, E, G
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = this.audioContext.createOscillator();
                        const gain = this.audioContext.createGain();

                        osc.connect(gain);
                        gain.connect(this.masterGain);

                        osc.frequency.value = freq;
                        osc.type = 'triangle';
                        gain.gain.value = 0.1;

                        osc.start();
                        gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                        osc.stop(this.audioContext.currentTime + 0.3);
                    }, i * 100);
                });
            }

            // Play fail sound
            playFail() {
                if (!this.audioContext) return;

                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.frequency.value = 200;
                osc.type = 'sawtooth';
                gain.gain.value = 0.15;

                osc.start();
                osc.frequency.exponentialRampToValueAtTime(100, this.audioContext.currentTime + 0.3);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                osc.stop(this.audioContext.currentTime + 0.3);
            }

            // Play baking sound (sizzle)
            playBaking() {
                if (!this.audioContext) return;

                const bufferSize = this.audioContext.sampleRate * 0.5;
                const buffer = this.audioContext.createBuffer(1, bufferSize, this.audioContext.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.1 * (1 - i / bufferSize);
                }

                const source = this.audioContext.createBufferSource();
                const gain = this.audioContext.createGain();
                const filter = this.audioContext.createBiquadFilter();

                filter.type = 'lowpass';
                filter.frequency.value = 2000;

                source.buffer = buffer;
                source.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterGain);

                gain.gain.value = 0.05;
                source.start();
            }

            // Play level up sound
            playLevelUp() {
                if (!this.audioContext) return;

                const notes = [523, 659, 784, 1047]; // C, E, G, C
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = this.audioContext.createOscillator();
                        const gain = this.audioContext.createGain();

                        osc.connect(gain);
                        gain.connect(this.masterGain);

                        osc.frequency.value = freq;
                        osc.type = 'square';
                        gain.gain.value = 0.08;

                        osc.start();
                        gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                        osc.stop(this.audioContext.currentTime + 0.2);
                    }, i * 80);
                });
            }

            // Background music (simple ambient)
            playBGM() {
                if (!this.audioContext) return;

                // Simple ambient drone
                const osc1 = this.audioContext.createOscillator();
                const osc2 = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.masterGain);

                osc1.frequency.value = 110; // A
                osc2.frequency.value = 165; // E
                osc1.type = 'sine';
                osc2.type = 'sine';
                gain.gain.value = 0.02;

                osc1.start();
                osc2.start();

                // Stop after a while (would loop in real implementation)
                setTimeout(() => {
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 2);
                    osc1.stop(this.audioContext.currentTime + 2);
                    osc2.stop(this.audioContext.currentTime + 2);
                }, 10000);
            }
        }

        // ========================================
        // PARTICLE SYSTEM
        // ========================================
        class Particle {
            constructor(x, y, color, vx, vy, lifetime = 1000) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.lifetime = lifetime;
                this.age = 0;
                this.size = Math.random() * 3 + 2;
            }

            update(deltaTime) {
                this.x += this.vx * deltaTime / 16;
                this.y += this.vy * deltaTime / 16;
                this.vy += 0.2; // Gravity
                this.age += deltaTime;
            }

            draw(ctx) {
                const alpha = 1 - (this.age / this.lifetime);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }

            isDead() {
                return this.age >= this.lifetime;
            }
        }

        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
            }

            emit(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed - 3;

                    this.particles.push(new Particle(x, y, color, vx, vy, GameConfig.PARTICLE_LIFETIME));
                }
            }

            update(deltaTime) {
                this.particles.forEach(p => p.update(deltaTime));
                this.particles = this.particles.filter(p => !p.isDead());
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.particles.forEach(p => p.draw(this.ctx));
            }
        }

        // ========================================
        // CUSTOMER CLASS
        // ========================================
        class Customer {
            constructor(id) {
                this.id = id;
                this.name = GameConfig.CUSTOMER_NAMES[Math.floor(Math.random() * GameConfig.CUSTOMER_NAMES.length)];
                this.patience = GameConfig.CUSTOMER_PATIENCE;
                this.maxPatience = GameConfig.CUSTOMER_PATIENCE;
                this.emotion = 'neutral';
                this.x = -20;
                this.targetX = 50;
                this.y = 80;
                this.served = false;
            }

            update(deltaTime) {
                // Move to counter
                if (this.x < this.targetX) {
                    this.x += 0.5;
                }

                // Decrease patience
                if (!this.served && this.x >= this.targetX) {
                    this.patience -= deltaTime;

                    if (this.patience <= 0) {
                        this.emotion = 'angry';
                        return 'angry';
                    } else if (this.patience < this.maxPatience * 0.3) {
                        this.emotion = 'neutral';
                    }
                }

                return 'waiting';
            }

            serve() {
                this.served = true;
                this.emotion = 'happy';
                return 'served';
            }

            getpatienceRatio() {
                return Math.max(0, this.patience / this.maxPatience);
            }
        }

        // ========================================
        // GAME LOGIC CORE
        // ========================================
        class GameLogic {
            constructor() {
                this.lastUpdateTime = Date.now();
                this.customerSpawnTimer = 0;
                this.autoProductionTimer = 0;
                this.nextCustomerId = 0;
            }

            // Calculate upgrade cost
            getUpgradeCost(upgradeType) {
                const level = GameState.upgrades[upgradeType];
                const baseCost = GameConfig.UPGRADE_COSTS[upgradeType];
                const multiplier = GameConfig.UPGRADE_MULTIPLIERS[upgradeType];
                return Math.floor(baseCost * Math.pow(multiplier, level));
            }

            // Buy upgrade
            buyUpgrade(upgradeType) {
                const cost = this.getUpgradeCost(upgradeType);

                if (GameState.money >= cost) {
                    GameState.money -= cost;
                    GameState.upgrades[upgradeType]++;

                    audioEngine.playLevelUp();
                    showNotification(`업그레이드 성공! ${upgradeType} Lv.${GameState.upgrades[upgradeType]}`, 'success');

                    this.updateUI();
                    return true;
                }

                audioEngine.playFail();
                showNotification('돈이 부족합니다!', 'warning');
                return false;
            }

            // Add money
            addMoney(amount) {
                const multiplier = GameState.boostActive ? 2 : 1;
                const finalAmount = Math.floor(amount * multiplier);

                GameState.money += finalAmount;
                GameState.stats.totalMoneyEarned += finalAmount;

                audioEngine.playMoney();
                this.updateUI();
            }

            // Add resource
            addResource(type, amount) {
                const multiplier = GameState.boostActive ? 2 : 1;
                const finalAmount = Math.floor(amount * multiplier);

                GameState[type] += finalAmount;
                this.updateUI();
            }

            // Merge filling
            mergeFilling() {
                if (GameState.kadayif >= GameConfig.FILLING_KADAYIF_COST &&
                    GameState.pistachio >= GameConfig.FILLING_PISTACHIO_COST) {

                    GameState.kadayif -= GameConfig.FILLING_KADAYIF_COST;
                    GameState.pistachio -= GameConfig.FILLING_PISTACHIO_COST;
                    this.addResource('filling', 1);

                    audioEngine.playSuccess();
                    showNotification('두바이 필링 완성!', 'success');

                    // Particle effect
                    particleSystem.emit(
                        canvas.width / 2,
                        canvas.height / 2,
                        GameConfig.PARTICLE_COUNT,
                        GameConfig.COLORS.particleGreen
                    );

                    return true;
                }

                audioEngine.playFail();
                showNotification('재료가 부족합니다!', 'warning');
                return false;
            }

            // Buy dough
            buyDough() {
                if (GameState.money >= GameConfig.DOUGH_PRICE) {
                    GameState.money -= GameConfig.DOUGH_PRICE;
                    this.addResource('dough', 1);

                    audioEngine.playClick();
                    showNotification('쿠키 도우 구매!', 'success');

                    return true;
                }

                audioEngine.playFail();
                showNotification('돈이 부족합니다!', 'warning');
                return false;
            }

            // Spawn customer
            spawnCustomer() {
                const customer = new Customer(this.nextCustomerId++);
                GameState.customers.push(customer);

                this.updateCustomerQueue();
            }

            // Serve customer
            serveCustomer(customer) {
                if (GameState.cookies > 0) {
                    GameState.cookies--;
                    customer.serve();

                    // Calculate price
                    const basePrice = GameConfig.COOKIE_BASE_PRICE;
                    const priceMultiplier = 1 + (GameState.upgrades.sellPrice * 0.2);
                    const finalPrice = Math.floor(basePrice * priceMultiplier);

                    this.addMoney(finalPrice);

                    GameState.stats.totalCookiesSold++;
                    GameState.stats.happyCustomers++;

                    audioEngine.playSuccess();

                    // Particle effect
                    particleSystem.emit(
                        canvas.width / 2,
                        canvas.height / 2,
                        GameConfig.PARTICLE_COUNT,
                        GameConfig.COLORS.particleGold
                    );

                    // Screen shake
                    GameState.shakeAmount = 5;

                    // Remove customer after animation
                    setTimeout(() => {
                        const index = GameState.customers.indexOf(customer);
                        if (index > -1) {
                            GameState.customers.splice(index, 1);
                            this.updateCustomerQueue();
                        }
                    }, 1000);

                    return true;
                }

                return false;
            }

            // Update customers
            updateCustomers(deltaTime) {
                const toRemove = [];

                GameState.customers.forEach(customer => {
                    const status = customer.update(deltaTime);

                    if (status === 'angry') {
                        toRemove.push(customer);
                        GameState.stats.angryCustomers++;
                        audioEngine.playFail();
                        showNotification(`${customer.name}님이 화나서 떠났어요!`, 'warning');
                    }
                });

                // Remove angry customers
                toRemove.forEach(customer => {
                    const index = GameState.customers.indexOf(customer);
                    if (index > -1) {
                        GameState.customers.splice(index, 1);
                    }
                });

                if (toRemove.length > 0) {
                    this.updateCustomerQueue();
                }
            }

            // Auto production
            autoProduction(deltaTime) {
                this.autoProductionTimer += deltaTime;

                if (this.autoProductionTimer >= 1000) { // Every second
                    this.autoProductionTimer = 0;

                    // Auto kadayif
                    if (GameState.upgrades.autoKadayif > 0) {
                        this.addResource('kadayif', GameState.upgrades.autoKadayif);
                    }

                    // Auto pistachio
                    if (GameState.upgrades.autoPistachio > 0) {
                        this.addResource('pistachio', GameState.upgrades.autoPistachio);
                    }

                    // Auto oven
                    if (GameState.upgrades.autoOven > 0) {
                        if (GameState.dough >= GameConfig.BAKING_DOUGH_COST &&
                            GameState.filling >= GameConfig.BAKING_FILLING_COST) {

                            GameState.dough -= GameConfig.BAKING_DOUGH_COST;
                            GameState.filling -= GameConfig.BAKING_FILLING_COST;
                            this.addResource('cookies', 1);
                        }
                    }
                }
            }

            // Update UI
            updateUI() {
                // Money
                document.getElementById('money-value').textContent = formatNumber(GameState.money);

                // Resources
                document.getElementById('kadayif-amount').textContent = formatNumber(GameState.kadayif);
                document.getElementById('pistachio-amount').textContent = formatNumber(GameState.pistachio);
                document.getElementById('filling-amount').textContent = formatNumber(GameState.filling);
                document.getElementById('dough-amount').textContent = formatNumber(GameState.dough);
                document.getElementById('cookie-amount').textContent = formatNumber(GameState.cookies);

                // Upgrade buttons
                Object.keys(GameState.upgrades).forEach(key => {
                    const cost = this.getUpgradeCost(key);
                    const level = GameState.upgrades[key];
                    const canAfford = GameState.money >= cost;

                    const btn = document.getElementById(`upgrade-${key.replace(/([A-Z])/g, '-$1').toLowerCase()}`);
                    if (btn) {
                        btn.disabled = !canAfford;
                        document.getElementById(`cost-${key.replace(/([A-Z])/g, '-$1').toLowerCase()}`).textContent = `₩${formatNumber(cost)}`;
                        document.getElementById(`level-${key.replace(/([A-Z])/g, '-$1').toLowerCase()}`).textContent = level;
                    }
                });

                // Production buttons
                document.getElementById('merge-filling-btn').disabled = !(
                    GameState.kadayif >= GameConfig.FILLING_KADAYIF_COST &&
                    GameState.pistachio >= GameConfig.FILLING_PISTACHIO_COST
                );

                document.getElementById('bake-btn').disabled = !(
                    GameState.dough >= GameConfig.BAKING_DOUGH_COST &&
                    GameState.filling >= GameConfig.BAKING_FILLING_COST
                );

                document.getElementById('buy-dough-btn').disabled = GameState.money < GameConfig.DOUGH_PRICE;

                // Stats
                document.getElementById('stat-total-cookies').textContent = formatNumber(GameState.stats.totalCookiesSold);
                document.getElementById('stat-total-money').textContent = `₩${formatNumber(GameState.stats.totalMoneyEarned)}`;
                document.getElementById('stat-happy-customers').textContent = formatNumber(GameState.stats.happyCustomers);
                document.getElementById('stat-angry-customers').textContent = formatNumber(GameState.stats.angryCustomers);

                const playMinutes = Math.floor((Date.now() - GameState.stats.sessionStartTime) / 60000);
                document.getElementById('stat-playtime').textContent = `${playMinutes}분`;

                // Money per second calculation
                const priceMultiplier = 1 + (GameState.upgrades.sellPrice * 0.2);
                const basePrice = GameConfig.COOKIE_BASE_PRICE * priceMultiplier;
                const customerRate = 1 / (GameConfig.CUSTOMER_SPAWN_INTERVAL / 1000);
                const moneyPerSec = Math.floor(basePrice * customerRate * 0.8); // Estimate
                document.getElementById('stat-money-per-sec').textContent = `₩${formatNumber(moneyPerSec)}`;
            }

            // Update customer queue UI
            updateCustomerQueue() {
                const container = document.getElementById('customer-queue');
                container.innerHTML = '';

                GameState.customers.slice(0, 5).forEach(customer => {
                    const item = document.createElement('div');
                    item.className = 'customer-item';
                    item.innerHTML = `
                        <div class="customer-emotion">${customer.emotion === 'happy' ? '😊' : customer.emotion === 'angry' ? '😠' : '😐'}</div>
                        <div class="customer-info">
                            <div class="customer-name">${customer.name}</div>
                            <div class="customer-patience">
                                <div class="customer-patience-bar" style="width: ${customer.getpatienceRatio() * 100}%"></div>
                            </div>
                        </div>
                    `;
                    item.onclick = () => this.serveCustomer(customer);
                    container.appendChild(item);
                });
            }

            // Main update loop
            update() {
                const now = Date.now();
                const deltaTime = now - this.lastUpdateTime;
                this.lastUpdateTime = now;

                // Update customers
                this.updateCustomers(deltaTime);

                // Spawn customers
                const spawnInterval = GameConfig.CUSTOMER_SPAWN_INTERVAL / (1 + GameState.upgrades.customerSpeed * 0.2);
                this.customerSpawnTimer += deltaTime;

                if (this.customerSpawnTimer >= spawnInterval) {
                    this.customerSpawnTimer = 0;
                    if (GameState.customers.length < 10) {
                        this.spawnCustomer();
                    }
                }

                // Auto production
                this.autoProduction(deltaTime);

                // Check boost expiration
                if (GameState.boostActive && Date.now() > GameState.boostEndTime) {
                    GameState.boostActive = false;
                    showNotification('부스트 효과가 종료되었습니다', 'warning');
                }

                // Update shake
                if (GameState.shakeAmount > 0) {
                    GameState.shakeAmount *= GameState.shakeDecay;
                    if (GameState.shakeAmount < 0.1) {
                        GameState.shakeAmount = 0;
                    }
                }

                // Update UI periodically
                if (Math.floor(now / 100) !== Math.floor((now - deltaTime) / 100)) {
                    this.updateUI();
                }
            }
        }

        // ========================================
        // SAVE/LOAD SYSTEM
        // ========================================
        class SaveSystem {
            save() {
                const saveData = {
                    money: GameState.money,
                    kadayif: GameState.kadayif,
                    pistachio: GameState.pistachio,
                    filling: GameState.filling,
                    dough: GameState.dough,
                    cookies: GameState.cookies,
                    upgrades: GameState.upgrades,
                    stats: GameState.stats,
                    lastSaveTime: Date.now()
                };

                localStorage.setItem(GameConfig.SAVE_KEY, JSON.stringify(saveData));
            }

            load() {
                const saveData = localStorage.getItem(GameConfig.SAVE_KEY);

                if (saveData) {
                    try {
                        const data = JSON.parse(saveData);

                        GameState.money = data.money || 0;
                        GameState.kadayif = data.kadayif || 0;
                        GameState.pistachio = data.pistachio || 0;
                        GameState.filling = data.filling || 0;
                        GameState.dough = data.dough || 0;
                        GameState.cookies = data.cookies || 0;
                        GameState.upgrades = data.upgrades || GameState.upgrades;
                        GameState.stats = data.stats || GameState.stats;

                        // Calculate offline earnings
                        const offlineTime = Date.now() - (data.lastSaveTime || Date.now());
                        const maxOfflineTime = Math.min(offlineTime, GameConfig.MAX_OFFLINE_TIME);

                        if (maxOfflineTime > 60000) { // More than 1 minute
                            this.calculateOfflineEarnings(maxOfflineTime);
                        }

                        return true;
                    } catch (e) {
                        console.error('Failed to load save:', e);
                        return false;
                    }
                }

                return false;
            }

            calculateOfflineEarnings(timeAway) {
                const minutes = Math.floor(timeAway / 60000);

                // Calculate earnings based on upgrades
                const autoKadayifRate = GameState.upgrades.autoKadayif;
                const autoPistachioRate = GameState.upgrades.autoPistachio;

                // Estimate cookies produced
                const fillingsProduced = Math.floor(minutes * Math.min(autoKadayifRate / 5, autoPistachioRate / 3));
                const cookiesProduced = Math.min(fillingsProduced, GameState.dough);

                // Calculate money earned
                const priceMultiplier = 1 + (GameState.upgrades.sellPrice * 0.2);
                const basePrice = GameConfig.COOKIE_BASE_PRICE * priceMultiplier;
                const earnings = Math.floor(cookiesProduced * basePrice * GameConfig.OFFLINE_EARNINGS_RATE);

                if (earnings > 0) {
                    // Show offline earnings modal
                    document.getElementById('offline-earnings').textContent = formatNumber(earnings);
                    document.getElementById('offline-time').textContent = minutes;

                    // Store earnings to be claimed
                    GameState.pendingOfflineEarnings = earnings;

                    document.getElementById('offline-modal').classList.add('active');
                }
            }

            reset() {
                if (confirm('정말로 게임을 초기화하시겠습니까? 모든 진행 상황이 삭제됩니다!')) {
                    localStorage.removeItem(GameConfig.SAVE_KEY);
                    location.reload();
                }
            }
        }

        // ========================================
        // MINIGAME CONTROLLERS
        // ========================================
        class KadayifMinigame {
            constructor() {
                this.canvas = document.getElementById('minigame-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.progress = 0;
                this.targetZone = 0.5;
                this.zoneSize = 0.2;
                this.movingBar = 0;
                this.direction = 1;
                this.speed = 0.02;
                this.active = false;
            }

            start() {
                this.active = true;
                this.progress = 0;
                this.movingBar = 0;

                document.getElementById('minigame-title').textContent = '🔥 카다이프면 볶기';
                document.getElementById('minigame-instruction').textContent = '녹색 구간에서 클릭하세요! (10번 성공)';
                document.getElementById('minigame-modal').classList.add('active');

                this.update();
            }

            update() {
                if (!this.active) return;

                // Move bar
                this.movingBar += this.direction * this.speed;

                if (this.movingBar >= 1 || this.movingBar <= 0) {
                    this.direction *= -1;
                    this.movingBar = Math.max(0, Math.min(1, this.movingBar));
                }

                // Draw
                this.draw();

                // Update progress bar
                document.getElementById('minigame-progress-bar').style.width = `${this.progress * 10}%`;
                document.getElementById('minigame-progress-bar').textContent = `${Math.floor(this.progress * 10)}%`;

                if (this.active) {
                    requestAnimationFrame(() => this.update());
                }
            }

            draw() {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                // Clear
                ctx.fillStyle = GameConfig.COLORS.background;
                ctx.fillRect(0, 0, width, height);

                // Draw pan
                ctx.fillStyle = '#555';
                ctx.fillRect(50, height - 100, width - 100, 80);

                // Draw target zone (green)
                const zoneStart = (this.targetZone - this.zoneSize / 2) * (width - 100) + 50;
                const zoneWidth = this.zoneSize * (width - 100);
                ctx.fillStyle = GameConfig.COLORS.secondary;
                ctx.fillRect(zoneStart, height - 100, zoneWidth, 80);

                // Draw moving bar (kadayif)
                const barX = this.movingBar * (width - 100) + 50;
                ctx.fillStyle = GameConfig.COLORS.kadayif;
                ctx.fillRect(barX - 10, height - 120, 20, 100);

                // Draw fire
                for (let i = 0; i < 10; i++) {
                    const x = 50 + i * (width - 100) / 10;
                    const flicker = Math.random() * 10;
                    ctx.fillStyle = GameConfig.COLORS.ovenFire;
                    ctx.fillRect(x, height - 20 + flicker, 20, 20 - flicker);
                }
            }

            click() {
                if (!this.active) return;

                const inZone = Math.abs(this.movingBar - this.targetZone) < this.zoneSize / 2;

                if (inZone) {
                    this.progress++;
                    audioEngine.playSuccess();

                    // Increase difficulty
                    this.speed += 0.005;

                    if (this.progress >= 10) {
                        this.complete();
                    }
                } else {
                    this.progress = Math.max(0, this.progress - 0.5);
                    audioEngine.playFail();
                }
            }

            complete() {
                this.active = false;
                gameLogic.addResource('kadayif', 5);

                audioEngine.playLevelUp();
                showNotification('카다이프면 5개 획득!', 'success');

                document.getElementById('minigame-modal').classList.remove('active');
            }

            close() {
                this.active = false;
            }
        }

        class PistachioMinigame {
            constructor() {
                this.canvas = document.getElementById('minigame-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.progress = 0;
                this.nuts = [];
                this.active = false;
            }

            start() {
                this.active = true;
                this.progress = 0;
                this.nuts = [];

                // Spawn nuts
                for (let i = 0; i < 20; i++) {
                    this.nuts.push({
                        x: Math.random() * (this.canvas.width - 40) + 20,
                        y: Math.random() * (this.canvas.height - 40) + 20,
                        crushed: false
                    });
                }

                document.getElementById('minigame-title').textContent = '🥜 피스타치오 분쇄';
                document.getElementById('minigame-instruction').textContent = '피스타치오를 클릭해서 분쇄하세요!';
                document.getElementById('minigame-modal').classList.add('active');

                this.canvas.onclick = (e) => this.click(e);

                this.update();
            }

            update() {
                if (!this.active) return;

                this.draw();

                // Update progress
                const crushedCount = this.nuts.filter(n => n.crushed).length;
                const progressPercent = (crushedCount / this.nuts.length) * 100;
                document.getElementById('minigame-progress-bar').style.width = `${progressPercent}%`;
                document.getElementById('minigame-progress-bar').textContent = `${Math.floor(progressPercent)}%`;

                if (crushedCount >= this.nuts.length) {
                    this.complete();
                }

                if (this.active) {
                    requestAnimationFrame(() => this.update());
                }
            }

            draw() {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                // Clear
                ctx.fillStyle = GameConfig.COLORS.background;
                ctx.fillRect(0, 0, width, height);

                // Draw mortar
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, 100, 0, Math.PI * 2);
                ctx.fill();

                // Draw nuts
                this.nuts.forEach(nut => {
                    if (!nut.crushed) {
                        ctx.fillStyle = GameConfig.COLORS.pistachioFilling;
                        ctx.beginPath();
                        ctx.arc(nut.x, nut.y, 8, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Draw crushed particles
                        ctx.fillStyle = GameConfig.COLORS.pistachioDeep;
                        for (let i = 0; i < 5; i++) {
                            const offsetX = (Math.random() - 0.5) * 10;
                            const offsetY = (Math.random() - 0.5) * 10;
                            ctx.fillRect(nut.x + offsetX, nut.y + offsetY, 2, 2);
                        }
                    }
                });
            }

            click(e) {
                if (!this.active) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                this.nuts.forEach(nut => {
                    if (!nut.crushed) {
                        const distance = Math.sqrt((nut.x - x) ** 2 + (nut.y - y) ** 2);
                        if (distance < 10) {
                            nut.crushed = true;
                            audioEngine.playClick();
                        }
                    }
                });
            }

            complete() {
                this.active = false;
                this.canvas.onclick = null;

                gameLogic.addResource('pistachio', 3);

                audioEngine.playLevelUp();
                showNotification('피스타치오 3개 획득!', 'success');

                document.getElementById('minigame-modal').classList.remove('active');
            }

            close() {
                this.active = false;
                this.canvas.onclick = null;
            }
        }

        class BakingMinigame {
            constructor() {
                this.canvas = document.getElementById('baking-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.temperature = 0;
                this.targetTemp = 180;
                this.tempRange = 20;
                this.time = 0;
                this.maxTime = 5000;
                this.active = false;
            }

            start() {
                if (GameState.dough < GameConfig.BAKING_DOUGH_COST ||
                    GameState.filling < GameConfig.BAKING_FILLING_COST) {
                    audioEngine.playFail();
                    showNotification('재료가 부족합니다!', 'warning');
                    return false;
                }

                GameState.dough -= GameConfig.BAKING_DOUGH_COST;
                GameState.filling -= GameConfig.BAKING_FILLING_COST;

                this.active = true;
                this.temperature = 0;
                this.time = 0;

                document.getElementById('baking-modal').classList.add('active');

                this.canvas.onclick = () => this.click();

                audioEngine.playBaking();

                this.update();
                return true;
            }

            update() {
                if (!this.active) return;

                // Increase temperature
                this.temperature += Math.random() * 5;

                // Time passes
                this.time += 16;

                this.draw();

                // Update progress
                const progress = (this.time / this.maxTime) * 100;
                document.getElementById('baking-progress-bar').style.width = `${progress}%`;
                document.getElementById('baking-progress-bar').textContent = `${Math.floor(progress)}%`;

                if (this.time >= this.maxTime) {
                    this.fail();
                }

                if (this.active) {
                    requestAnimationFrame(() => this.update());
                }
            }

            draw() {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                // Clear
                ctx.fillStyle = GameConfig.COLORS.background;
                ctx.fillRect(0, 0, width, height);

                // Draw oven
                ctx.fillStyle = '#555';
                ctx.fillRect(50, 100, width - 100, 150);

                // Draw cookie inside
                const sprite = new SpriteEngine(ctx);
                const cookieSize = 15 + (this.time / this.maxTime) * 5;
                sprite.drawCookie(width / 2 / GameConfig.PIXEL_SIZE, 175 / GameConfig.PIXEL_SIZE, cookieSize);

                // Draw thermometer
                ctx.fillStyle = '#fff';
                ctx.fillRect(width - 80, 50, 30, 200);

                // Temperature bar
                const tempHeight = (this.temperature / 250) * 180;
                const inRange = Math.abs(this.temperature - this.targetTemp) < this.tempRange;
                ctx.fillStyle = inRange ? GameConfig.COLORS.secondary : '#ff4444';
                ctx.fillRect(width - 75, 230 - tempHeight, 20, tempHeight);

                // Target zone
                const targetY = 230 - (this.targetTemp / 250) * 180;
                ctx.strokeStyle = GameConfig.COLORS.secondary;
                ctx.lineWidth = 3;
                ctx.strokeRect(width - 80, targetY - this.tempRange / 2, 30, this.tempRange);

                // Temperature text
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText(`${Math.floor(this.temperature)}°C`, width - 78, 40);
            }

            click() {
                if (!this.active) return;

                const inRange = Math.abs(this.temperature - this.targetTemp) < this.tempRange;

                if (inRange) {
                    this.complete();
                } else {
                    audioEngine.playFail();
                    showNotification('타이밍을 잘 맞춰주세요!', 'warning');
                }
            }

            complete() {
                this.active = false;
                this.canvas.onclick = null;

                gameLogic.addResource('cookies', 1);

                audioEngine.playLevelUp();
                showNotification('완벽한 쿠키 완성!', 'success');

                // Particle effect
                particleSystem.emit(
                    canvas.width / 2,
                    canvas.height / 2,
                    GameConfig.PARTICLE_COUNT * 2,
                    GameConfig.COLORS.particleGold
                );

                document.getElementById('baking-modal').classList.remove('active');
            }

            fail() {
                this.active = false;
                this.canvas.onclick = null;

                audioEngine.playFail();
                showNotification('쿠키가 타버렸어요! 재료 손실...', 'warning');

                document.getElementById('baking-modal').classList.remove('active');
            }

            close() {
                this.active = false;
                this.canvas.onclick = null;
            }
        }

        // ========================================
        // UTILITY FUNCTIONS
        // ========================================
        function formatNumber(num) {
            if (num >= 1000000000) {
                return (num / 1000000000).toFixed(1) + 'B';
            } else if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return Math.floor(num).toString();
        }

        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;

            container.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => {
                    container.removeChild(notification);
                }, 300);
            }, 3000);
        }

        function switchTab(tabName) {
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');

            audioEngine.playClick();
        }

        // ========================================
        // AD SYSTEM (Placeholder)
        // ========================================
        function watchRewardAd(rewardType) {
            audioEngine.playClick();

            // In production, this would call actual ad SDK
            // AdMob.showRewardedAd().then(() => { ... });

            // Simulate ad watching
            showNotification('광고를 시청하는 중...', 'info');

            setTimeout(() => {
                switch(rewardType) {
                    case 'boost':
                        GameState.boostActive = true;
                        GameState.boostEndTime = Date.now() + 60000; // 1 minute
                        audioEngine.playLevelUp();
                        showNotification('1분간 2배 부스트 활성화!', 'success');
                        break;

                    case 'offline':
                        const earnings = GameState.pendingOfflineEarnings * 2;
                        GameState.money += earnings;
                        GameState.pendingOfflineEarnings = 0;
                        audioEngine.playMoney();
                        showNotification(`${formatNumber(earnings)}원 획득!`, 'success');
                        document.getElementById('offline-modal').classList.remove('active');
                        gameLogic.updateUI();
                        break;
                }
            }, 2000);
        }

        // ========================================
        // GLOBAL FUNCTIONS (Called from HTML)
        // ========================================
        function startKadayifMinigame() {
            audioEngine.playClick();
            kadayifMinigame.start();
        }

        function startPistachioMinigame() {
            audioEngine.playClick();
            pistachioMinigame.start();
        }

        function mergeFilling() {
            audioEngine.playClick();
            gameLogic.mergeFilling();
        }

        function startBaking() {
            audioEngine.playClick();
            bakingMinigame.start();
        }

        function buyDough() {
            audioEngine.playClick();
            gameLogic.buyDough();
        }

        function buyUpgrade(type) {
            audioEngine.playClick();
            gameLogic.buyUpgrade(type);
        }

        function closeMinigame() {
            audioEngine.playClick();
            document.getElementById('minigame-modal').classList.remove('active');
            kadayifMinigame.close();
            pistachioMinigame.close();
        }

        function closeOfflineModal() {
            audioEngine.playClick();

            if (GameState.pendingOfflineEarnings) {
                GameState.money += GameState.pendingOfflineEarnings;
                GameState.pendingOfflineEarnings = 0;
                gameLogic.updateUI();
            }

            document.getElementById('offline-modal').classList.remove('active');
        }

        function resetGame() {
            saveSystem.reset();
        }

        // ========================================
        // MAIN GAME LOOP & INITIALIZATION
        // ========================================
        let canvas, ctx, particleCanvas, particleSystem;
        let audioEngine, gameLogic, saveSystem;
        let kadayifMinigame, pistachioMinigame, bakingMinigame;
        let spriteEngine;
        let lastFrameTime = Date.now();

        function initGame() {
            // Initialize canvas
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');

            // Set canvas size
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Initialize particle system
            particleCanvas = document.getElementById('particle-canvas');
            particleSystem = new ParticleSystem(particleCanvas);
            resizeParticleCanvas();

            // Initialize engines
            audioEngine = new AudioEngine();
            spriteEngine = new SpriteEngine(ctx);
            gameLogic = new GameLogic();
            saveSystem = new SaveSystem();

            // Initialize minigames
            kadayifMinigame = new KadayifMinigame();
            pistachioMinigame = new PistachioMinigame();
            bakingMinigame = new BakingMinigame();

            // Load save
            saveSystem.load();

            // Update UI
            gameLogic.updateUI();

            // Auto-save interval
            setInterval(() => {
                saveSystem.save();
            }, GameConfig.AUTO_SAVE_INTERVAL);

            // Mobile panel toggle
            const toggleBtn = document.getElementById('toggle-panel-btn');
            const sidePanel = document.getElementById('side-panel');

            if (window.innerWidth <= 768) {
                toggleBtn.style.display = 'block';
                toggleBtn.onclick = () => {
                    sidePanel.classList.toggle('open');
                    audioEngine.playClick();
                };
            }

            // Canvas click for main game interactions
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (canvas.height / rect.height);

                handleCanvasClick(x, y);
            });

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                audioEngine.playBGM();
            }, 2000);

            // Start game loop
            gameLoop();
        }

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function resizeParticleCanvas() {
            const container = document.getElementById('canvas-container');
            particleCanvas.width = container.clientWidth;
            particleCanvas.height = container.clientHeight;
        }

        function handleCanvasClick(x, y) {
            audioEngine.playClick();

            // Emit particles at click position
            particleSystem.emit(x, y, 5, GameConfig.COLORS.particle);
        }

        function gameLoop() {
            const now = Date.now();
            const deltaTime = now - lastFrameTime;
            lastFrameTime = now;

            // Update game logic
            gameLogic.update();

            // Update particles
            particleSystem.update(deltaTime);

            // Draw game
            drawGame();

            // Draw particles
            particleSystem.draw();

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        function drawGame() {
            // Apply screen shake
            if (GameState.shakeAmount > 0) {
                const shakeX = (Math.random() - 0.5) * GameState.shakeAmount;
                const shakeY = (Math.random() - 0.5) * GameState.shakeAmount;
                ctx.save();
                ctx.translate(shakeX, shakeY);
            }

            // Clear canvas
            ctx.fillStyle = GameConfig.COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw background
            spriteEngine.drawBackground();

            // Draw counter
            spriteEngine.drawCounter(50, 100);

            // Draw cookies on display
            if (GameState.cookies > 0) {
                const displayCookies = Math.min(GameState.cookies, 5);
                for (let i = 0; i < displayCookies; i++) {
                    spriteEngine.drawCookie(
                        15 + i * 5,
                        20,
                        8
                    );
                }
            }

            // Draw oven
            const ovenActive = GameState.upgrades.autoOven > 0;
            spriteEngine.drawOven(120, 50, ovenActive);

            // Draw customers
            GameState.customers.slice(0, 5).forEach((customer, index) => {
                spriteEngine.drawCustomer(
                    Math.floor(customer.x),
                    Math.floor(customer.y + index * 20),
                    customer.emotion
                );
            });

            // Draw resource indicators
            const resourceY = 30;

            // Kadayif
            if (GameState.kadayif > 0) {
                spriteEngine.drawKadayif(5, resourceY);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(`x${GameState.kadayif}`, 25, resourceY * GameConfig.PIXEL_SIZE + 8);
            }

            // Pistachio
            if (GameState.pistachio > 0) {
                spriteEngine.drawPistachio(15, resourceY);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(`x${GameState.pistachio}`, 65, resourceY * GameConfig.PIXEL_SIZE + 8);
            }

            // Filling
            if (GameState.filling > 0) {
                spriteEngine.drawFilling(25, resourceY);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(`x${GameState.filling}`, 105, resourceY * GameConfig.PIXEL_SIZE + 8);
            }

            // Boost indicator
            if (GameState.boostActive) {
                const timeLeft = Math.ceil((GameState.boostEndTime - Date.now()) / 1000);
                ctx.fillStyle = GameConfig.COLORS.accent;
                ctx.font = 'bold 24px Arial';
                ctx.fillText(`⚡ 2X BOOST (${timeLeft}s)`, canvas.width / 2 - 100, 40);
            }

            // Restore context if shake was applied
            if (GameState.shakeAmount > 0) {
                ctx.restore();
            }
        }

        // Loading bar animation
        let loadingProgress = 0;
        const loadingInterval = setInterval(() => {
            loadingProgress += Math.random() * 30;
            if (loadingProgress >= 100) {
                loadingProgress = 100;
                clearInterval(loadingInterval);
            }
            document.getElementById('loading-bar-fill').style.width = `${loadingProgress}%`;
        }, 100);

        // Start game when page loads
        window.addEventListener('load', () => {
            setTimeout(initGame, 1500);
        });

        // Save before unload
        window.addEventListener('beforeunload', () => {
            saveSystem.save();
        });

        // Prevent context menu on canvas
        canvas?.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2D1B0E">
    <title>두바이 쫀득 쿠키 타이쿤 🍪</title>
    <style>
        /* Color Palette */
        :root {
            --chocolate-dark: #2D1B0E;
            --chocolate-mid: #5D4037;
            --kataifi-gold: #FFD54F;
            --pistachio-main: #7CB342;
            --pistachio-dark: #558B2F;
            --pistachio-light: #C5E1A5;
            --dough-base: #D7C49E;
            --ui-panel: rgba(26, 15, 10, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: var(--chocolate-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: manipulation;
            color: white;
        }

        #game {
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, var(--chocolate-mid) 0%, var(--chocolate-dark) 100%);
            position: relative;
        }

        /* HUD */
        .hud {
            padding: 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .stat {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .money { color: var(--kataifi-gold); }
        .level {
            background: var(--pistachio-main);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 16px;
        }

        /* Canvas Area */
        #canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
        }

        #particle-canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* Bottom Panel */
        .bottom-panel {
            background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, transparent 100%);
            padding: 16px;
            max-height: 45vh;
            overflow-y: auto;
            z-index: 100;
        }

        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--pistachio-main);
            transform: scale(1.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--pistachio-main), var(--pistachio-dark));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--kataifi-gold), #FFC107);
            color: var(--chocolate-dark);
            font-size: 20px;
        }

        .upgrade-btn {
            background: linear-gradient(135deg, var(--chocolate-mid), var(--chocolate-dark));
            color: var(--kataifi-gold);
            text-align: left;
            padding: 12px;
        }

        .upgrade-name {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .upgrade-cost {
            display: block;
            font-size: 14px;
            opacity: 0.9;
        }

        .upgrade-level {
            position: absolute;
            top: 8px;
            right: 12px;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* Customer Queue */
        .customer {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 3px solid var(--kataifi-gold);
            cursor: pointer;
            transition: all 0.2s;
        }

        .customer:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.1);
        }

        .customer-emoji {
            font-size: 32px;
        }

        .customer-info {
            flex: 1;
        }

        .customer-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .patience-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .patience-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ffd700, var(--pistachio-main));
            transition: width 0.3s;
        }

        /* Resources */
        .resources {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .resource {
            background: var(--ui-panel);
            padding: 12px 8px;
            border-radius: 8px;
            text-align: center;
        }

        .resource-icon {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .resource-count {
            font-size: 16px;
            font-weight: bold;
            color: var(--kataifi-gold);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--ui-panel);
            padding: 32px;
            border-radius: 20px;
            border: 3px solid var(--kataifi-gold);
            text-align: center;
            max-width: 90%;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 28px;
            color: var(--kataifi-gold);
            margin-bottom: 16px;
        }

        .modal-text {
            font-size: 18px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Floating Text */
        .float-text {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            pointer-events: none;
            z-index: 200;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: floatUp 1.5s forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Screen Shake */
        .shake {
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        /* Loading */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--chocolate-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-emoji {
            font-size: 80px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 24px;
            color: var(--kataifi-gold);
            margin-top: 20px;
        }

        /* Scrollbar */
        .bottom-panel::-webkit-scrollbar {
            width: 6px;
        }

        .bottom-panel::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }

        .bottom-panel::-webkit-scrollbar-thumb {
            background: var(--pistachio-main);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-emoji">🍪</div>
        <div class="loading-text">두바이 쫀득 쿠키 타이쿤</div>
    </div>

    <div id="game">
        <div class="hud">
            <div class="stat money">💰 <span id="money">0</span></div>
            <div class="stat level">Lv. <span id="level">1</span></div>
        </div>

        <div id="canvas-area">
            <canvas id="canvas"></canvas>
            <canvas id="particle-canvas"></canvas>
        </div>

        <div class="bottom-panel">
            <div class="tab-bar">
                <button class="tab active" onclick="switchTab('main')">🍪 메인</button>
                <button class="tab" onclick="switchTab('upgrade')">⬆️ 업그레이드</button>
                <button class="tab" onclick="switchTab('customer')">👥 손님</button>
            </div>

            <div id="main-tab" class="tab-content active">
                <div class="resources">
                    <div class="resource">
                        <div class="resource-icon">🌾</div>
                        <div class="resource-count" id="kataifi">0</div>
                    </div>
                    <div class="resource">
                        <div class="resource-icon">🥜</div>
                        <div class="resource-count" id="pistachio">0</div>
                    </div>
                    <div class="resource">
                        <div class="resource-icon">🍯</div>
                        <div class="resource-count" id="filling">0</div>
                    </div>
                    <div class="resource">
                        <div class="resource-icon">🍪</div>
                        <div class="resource-count" id="cookies">0</div>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="tapCookie()">
                    🍪 쿠키 터치 (클릭!)
                </button>
                <button class="btn" onclick="harvestKataifi()">
                    🌾 카다이프 수확
                </button>
                <button class="btn" onclick="crushPistachio()">
                    🥜 피스타치오 분쇄
                </button>
                <button class="btn" onclick="makeFilling()" id="btn-filling">
                    🍯 필링 제조 (🌾5 + 🥜3)
                </button>
                <button class="btn" onclick="bakeCookie()" id="btn-bake">
                    🔥 쿠키 굽기 (🍯1)
                </button>
            </div>

            <div id="upgrade-tab" class="tab-content">
                <button class="upgrade-btn" onclick="buyUpgrade('autoKataifi')" id="up-autoKataifi">
                    <span class="upgrade-level">Lv <span id="lv-autoKataifi">0</span></span>
                    <span class="upgrade-name">🤖 자동 카다이프 생산</span>
                    <span class="upgrade-cost" id="cost-autoKataifi">₩1,000</span>
                </button>
                <button class="upgrade-btn" onclick="buyUpgrade('autoPistachio')" id="up-autoPistachio">
                    <span class="upgrade-level">Lv <span id="lv-autoPistachio">0</span></span>
                    <span class="upgrade-name">🤖 자동 피스타치오 생산</span>
                    <span class="upgrade-cost" id="cost-autoPistachio">₩1,500</span>
                </button>
                <button class="upgrade-btn" onclick="buyUpgrade('autoOven')" id="up-autoOven">
                    <span class="upgrade-level">Lv <span id="lv-autoOven">0</span></span>
                    <span class="upgrade-name">🔥 자동 오븐</span>
                    <span class="upgrade-cost" id="cost-autoOven">₩5,000</span>
                </button>
                <button class="upgrade-btn" onclick="buyUpgrade('price')" id="up-price">
                    <span class="upgrade-level">Lv <span id="lv-price">0</span></span>
                    <span class="upgrade-name">💰 판매가 상승 +20%</span>
                    <span class="upgrade-cost" id="cost-price">₩2,000</span>
                </button>
                <button class="upgrade-btn" onclick="buyUpgrade('speed')" id="up-speed">
                    <span class="upgrade-level">Lv <span id="lv-speed">0</span></span>
                    <span class="upgrade-name">⚡ 손님 스폰 속도</span>
                    <span class="upgrade-cost" id="cost-speed">₩3,000</span>
                </button>
            </div>

            <div id="customer-tab" class="tab-content">
                <div id="customer-list"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="offline-modal">
        <div class="modal-content">
            <div class="modal-title">💰 오프라인 수익</div>
            <div class="modal-text">
                알바생이 <span id="offline-earn" style="color: var(--kataifi-gold);">0</span>원을 벌었습니다!
            </div>
            <button class="btn btn-primary" onclick="claimOffline()">받기</button>
        </div>
    </div>

    <script>
        "use strict";

        // ============================================================================
        // GAME CONFIG
        // ============================================================================
        const CFG = {
            colors: {
                chocolate: { dark: '#2D1B0E', mid: '#5D4037', light: '#8D6E63' },
                kataifi: { gold: '#FFD54F', bright: '#FFC107' },
                pistachio: { main: '#7CB342', dark: '#558B2F', light: '#C5E1A5' },
                dough: { base: '#D7C49E', dark: '#A89C7E', light: '#F5E6D3' }
            },
            balance: {
                cookiePrice: 1000,
                fillingCost: { kataifi: 5, pistachio: 3 },
                upgradeCosts: { autoKataifi: 1000, autoPistachio: 1500, autoOven: 5000, price: 2000, speed: 3000 },
                upgradeMultipliers: { autoKataifi: 1.5, autoPistachio: 1.5, autoOven: 1.8, price: 1.3, speed: 1.4 }
            }
        };

        // ============================================================================
        // GAME STATE
        // ============================================================================
        const state = {
            money: 0,
            level: 1,
            exp: 0,
            expNext: 100,
            resources: { kataifi: 0, pistachio: 0, filling: 0, cookies: 0 },
            upgrades: { autoKataifi: 0, autoPistachio: 0, autoOven: 0, price: 0, speed: 0 },
            customers: [],
            clickPower: 1,
            lastSave: Date.now(),
            cookieState: {
                scale: 1,
                rotation: 0,
                ooze: 0,
                cracks: [],
                pulse: 0
            }
        };

        // ============================================================================
        // AUDIO ENGINE
        // ============================================================================
        class Audio {
            constructor() {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();
                    this.gain = this.ctx.createGain();
                    this.gain.gain.value = 0.3;
                    this.gain.connect(this.ctx.destination);
                } catch(e) {
                    this.ctx = null;
                }
            }

            play(type) {
                if (!this.ctx) return;
                this.ctx.resume();

                if (type === 'tap') {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.1);
                    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                    osc.connect(g);
                    g.connect(this.gain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.1);
                } else if (type === 'crunch') {
                    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.2, this.ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < data.length; i++) {
                        if (Math.random() > 0.7) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
                    }
                    const src = this.ctx.createBufferSource();
                    src.buffer = buf;
                    const filt = this.ctx.createBiquadFilter();
                    filt.type = 'highpass';
                    filt.frequency.value = 2000;
                    const g = this.ctx.createGain();
                    g.gain.value = 0.2;
                    src.connect(filt);
                    filt.connect(g);
                    g.connect(this.gain);
                    src.start();
                } else if (type === 'coin') {
                    [1047, 1319, 1568].forEach((f, i) => {
                        setTimeout(() => {
                            const osc = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            osc.frequency.value = f;
                            g.gain.setValueAtTime(0.15, this.ctx.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                            osc.connect(g);
                            g.connect(this.gain);
                            osc.start();
                            osc.stop(this.ctx.currentTime + 0.2);
                        }, i * 80);
                    });
                } else if (type === 'levelup') {
                    [523, 659, 784, 1047].forEach((f, i) => {
                        setTimeout(() => {
                            const osc = this.ctx.createOscillator();
                            const g = this.ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.value = f;
                            g.gain.setValueAtTime(0.12, this.ctx.currentTime);
                            g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                            osc.connect(g);
                            g.connect(this.gain);
                            osc.start();
                            osc.stop(this.ctx.currentTime + 0.25);
                        }, i * 100);
                    });
                }
            }
        }

        const audio = new Audio();

        // ============================================================================
        // PARTICLE SYSTEM
        // ============================================================================
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 1) * 15;
                this.color = color;
                this.life = 1;
                this.size = Math.random() * 5 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.5;
                this.vx *= 0.98;
                this.life -= 0.02;
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        const particles = [];

        function emitParticles(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // ============================================================================
        // PIXEL ART RENDERER
        // ============================================================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const pCanvas = document.getElementById('particle-canvas');
        const pCtx = pCanvas.getContext('2d');

        function resize() {
            const container = document.getElementById('canvas-area');
            canvas.width = pCanvas.width = container.clientWidth;
            canvas.height = pCanvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Pixel {
            constructor(ctx, size = 3) {
                this.ctx = ctx;
                this.s = size;
            }

            draw(x, y, color) {
                this.ctx.fillStyle = color;
                this.ctx.fillRect(x * this.s, y * this.s, this.s, this.s);
            }

            circle(cx, cy, r, color) {
                for (let x = -r; x <= r; x++) {
                    for (let y = -r; y <= r; y++) {
                        if (x*x + y*y <= r*r) {
                            this.draw(cx + x, cy + y, color);
                        }
                    }
                }
            }

            drawCookie(cx, cy, size) {
                const r = size / 2;
                const cs = state.cookieState;

                // Animated values
                const scale = cs.scale;
                const ooze = cs.ooze;
                const pulse = Math.sin(cs.pulse) * 2;

                // Layer 1: Dough (animated scale)
                this.circle(cx, cy, r * scale, CFG.colors.dough.base);
                this.circle(cx, cy, (r - 1) * scale, CFG.colors.dough.dark);

                // Layer 2: Chocolate
                this.circle(cx, cy, (r - 3) * scale, CFG.colors.chocolate.mid);
                this.circle(cx, cy, (r - 4) * scale, CFG.colors.chocolate.dark);

                // Layer 3: Kataifi strands (dynamic)
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2 + cs.rotation;
                    const dist = (r - 3) * scale + pulse;
                    const x = cx + Math.cos(angle) * dist;
                    const y = cy + Math.sin(angle) * dist;
                    this.draw(Math.floor(x), Math.floor(y), CFG.colors.kataifi.gold);
                }

                // Layer 4: Pistachio filling (oozing effect)
                const fillR = (r - 7) * scale + ooze;
                for (let x = -fillR; x <= fillR; x++) {
                    for (let y = -fillR; y <= fillR; y++) {
                        const noise = Math.sin(x * 0.5) * Math.cos(y * 0.5) * 2;
                        const adjR = fillR + noise;
                        if (x*x + y*y <= adjR*adjR) {
                            this.draw(cx + Math.floor(x), cy + Math.floor(y), CFG.colors.pistachio.main);
                        }
                    }
                }

                // Dark center
                this.circle(cx, cy, (r - 9) * scale, CFG.colors.pistachio.dark);

                // Chunks
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const dist = (r - 8) * scale;
                    const x = cx + Math.cos(angle) * dist;
                    const y = cy + Math.sin(angle) * dist;
                    this.draw(Math.floor(x), Math.floor(y), CFG.colors.pistachio.light);
                }

                // Highlight
                this.draw(cx - Math.floor(r/3), cy - Math.floor(r/3), CFG.colors.dough.light);

                // Cracks (appear on tap)
                cs.cracks.forEach(crack => {
                    const angle = crack.angle;
                    const len = crack.len;
                    for (let i = 0; i < len; i++) {
                        const dist = r * 0.5 + i * 2;
                        const x = cx + Math.cos(angle) * dist;
                        const y = cy + Math.sin(angle) * dist;
                        this.draw(Math.floor(x), Math.floor(y), CFG.colors.chocolate.dark);
                    }
                });
            }

            drawCustomer(x, y, mood) {
                // Body
                this.ctx.fillStyle = '#4169E1';
                this.ctx.fillRect(x * this.s, (y + 6) * this.s, 8 * this.s, 10 * this.s);

                // Head
                this.circle(x + 4, y + 3, 4, '#FFCC80');

                // Eyes
                this.draw(x + 2, y + 2, '#000');
                this.draw(x + 6, y + 2, '#000');

                // Mouth
                if (mood === 'happy') {
                    this.draw(x + 2, y + 5, '#000');
                    this.draw(x + 3, y + 6, '#000');
                    this.draw(x + 5, y + 6, '#000');
                    this.draw(x + 6, y + 5, '#000');
                } else if (mood === 'angry') {
                    this.draw(x + 2, y + 6, '#000');
                    this.draw(x + 3, y + 5, '#000');
                    this.draw(x + 5, y + 5, '#000');
                    this.draw(x + 6, y + 6, '#000');
                } else {
                    for (let i = 0; i < 4; i++) this.draw(x + 2 + i, y + 5, '#000');
                }
            }
        }

        const pixel = new Pixel(ctx, 3);

        // ============================================================================
        // GAME LOOP
        // ============================================================================
        function gameLoop() {
            // Clear
            ctx.fillStyle = CFG.colors.chocolate.dark;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background gradient
            for (let i = 0; i < 50; i++) {
                const ratio = i / 50;
                const r = Math.floor(93 + (45 - 93) * ratio);
                const g = Math.floor(64 + (27 - 64) * ratio);
                const b = Math.floor(55 + (14 - 55) * ratio);
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(0, i * canvas.height / 50, canvas.width, canvas.height / 50);
            }

            // Update cookie state
            const cs = state.cookieState;
            cs.scale += (1 - cs.scale) * 0.1;
            cs.ooze *= 0.95;
            cs.pulse += 0.1;
            cs.rotation += 0.01;
            cs.cracks.forEach(c => c.len *= 0.95);
            cs.cracks = cs.cracks.filter(c => c.len > 0.5);

            // Draw cookie
            const cx = Math.floor(canvas.width / pixel.s / 2);
            const cy = Math.floor(canvas.height / pixel.s / 2.5);
            pixel.drawCookie(cx, cy, 40);

            // Draw customers
            state.customers.forEach((c, i) => {
                c.x += (c.targetX - c.x) * 0.1;
                c.patience -= 16;
                if (c.patience <= 0) {
                    c.mood = 'angry';
                }
                pixel.drawCustomer(Math.floor(c.x), Math.floor(c.y + i * 5), c.mood);
            });

            // Particles
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach((p, i) => {
                p.update();
                p.draw(pCtx);
                if (p.life <= 0) particles.splice(i, 1);
            });

            requestAnimationFrame(gameLoop);
        }

        // ============================================================================
        // GAME ACTIONS
        // ============================================================================
        function tapCookie() {
            const cs = state.cookieState;
            cs.scale = 1.2;
            cs.ooze = 10;
            cs.cracks.push({ angle: Math.random() * Math.PI * 2, len: 8 });

            emitParticles(canvas.width / 2, canvas.height / 2.5, CFG.colors.pistachio.main, 30);
            shake();
            audio.play('tap');
            vibrate();
        }

        function harvestKataifi() {
            state.resources.kataifi += 3 * state.clickPower;
            audio.play('crunch');
            emitParticles(canvas.width / 2, canvas.height / 2, CFG.colors.kataifi.gold, 15);
            shake();
            updateUI();
        }

        function crushPistachio() {
            state.resources.pistachio += 2 * state.clickPower;
            audio.play('crunch');
            emitParticles(canvas.width / 2, canvas.height / 2, CFG.colors.pistachio.light, 15);
            shake();
            updateUI();
        }

        function makeFilling() {
            const c = CFG.balance.fillingCost;
            if (state.resources.kataifi >= c.kataifi && state.resources.pistachio >= c.pistachio) {
                state.resources.kataifi -= c.kataifi;
                state.resources.pistachio -= c.pistachio;
                state.resources.filling++;
                audio.play('tap');
                updateUI();
            }
        }

        function bakeCookie() {
            if (state.resources.filling >= 1) {
                state.resources.filling--;
                state.resources.cookies++;
                audio.play('tap');
                shake();
                updateUI();
            }
        }

        function sellCookie(customer) {
            if (state.resources.cookies > 0) {
                state.resources.cookies--;
                const price = CFG.balance.cookiePrice * state.level * (1 + state.upgrades.price * 0.2);
                state.money += Math.floor(price);
                state.exp += Math.floor(price * 0.05);

                customer.mood = 'happy';
                setTimeout(() => {
                    const idx = state.customers.indexOf(customer);
                    if (idx > -1) state.customers.splice(idx, 1);
                    updateCustomerUI();
                }, 500);

                audio.play('coin');
                floatText(`+${fmt(Math.floor(price))}원`, CFG.colors.kataifi.gold);

                if (state.exp >= state.expNext) levelUp();
                updateUI();
            }
        }

        function levelUp() {
            state.level++;
            state.exp = 0;
            state.expNext = Math.floor(state.expNext * 1.5);
            state.clickPower++;
            audio.play('levelup');
            shake();
            floatText(`레벨 ${state.level}!`, '#fff');
        }

        // ============================================================================
        // UPGRADES
        // ============================================================================
        function buyUpgrade(type) {
            const lvl = state.upgrades[type];
            const base = CFG.balance.upgradeCosts[type];
            const mult = CFG.balance.upgradeMultipliers[type];
            const cost = Math.floor(base * Math.pow(mult, lvl));

            if (state.money >= cost) {
                state.money -= cost;
                state.upgrades[type]++;
                audio.play('coin');
                updateUI();
            }
        }

        // Auto production
        setInterval(() => {
            if (state.upgrades.autoKataifi > 0) {
                state.resources.kataifi += state.upgrades.autoKataifi;
            }
            if (state.upgrades.autoPistachio > 0) {
                state.resources.pistachio += state.upgrades.autoPistachio;
            }
            if (state.upgrades.autoOven > 0) {
                if (state.resources.filling >= 1) {
                    state.resources.filling--;
                    state.resources.cookies++;
                }
            }
            // Auto filling
            const c = CFG.balance.fillingCost;
            if (state.resources.kataifi >= c.kataifi && state.resources.pistachio >= c.pistachio) {
                state.resources.kataifi -= c.kataifi;
                state.resources.pistachio -= c.pistachio;
                state.resources.filling++;
            }
            updateUI();
        }, 1000);

        // ============================================================================
        // CUSTOMERS
        // ============================================================================
        setInterval(() => {
            const interval = 5000 / (1 + state.upgrades.speed * 0.2);
            if (Math.random() < 16 / interval && state.customers.length < 5) {
                state.customers.push({
                    name: ['김민수', '이영희', '박철수', '최지영'][Math.floor(Math.random() * 4)],
                    x: -10,
                    y: 50,
                    targetX: 10 + state.customers.length * 12,
                    patience: 30000,
                    mood: 'neutral'
                });
                updateCustomerUI();
            }
        }, 16);

        function updateCustomerUI() {
            const list = document.getElementById('customer-list');
            list.innerHTML = '';
            state.customers.forEach(c => {
                const div = document.createElement('div');
                div.className = 'customer';
                div.innerHTML = `
                    <div class="customer-emoji">${c.mood === 'happy' ? '😊' : c.mood === 'angry' ? '😠' : '😐'}</div>
                    <div class="customer-info">
                        <div class="customer-name">${c.name}</div>
                        <div class="patience-bar">
                            <div class="patience-fill" style="width: ${Math.max(0, c.patience / 30000 * 100)}%"></div>
                        </div>
                    </div>
                `;
                div.onclick = () => sellCookie(c);
                list.appendChild(div);
            });
        }

        // ============================================================================
        // UI HELPERS
        // ============================================================================
        function updateUI() {
            document.getElementById('money').textContent = fmt(state.money);
            document.getElementById('level').textContent = state.level;
            document.getElementById('kataifi').textContent = state.resources.kataifi;
            document.getElementById('pistachio').textContent = state.resources.pistachio;
            document.getElementById('filling').textContent = state.resources.filling;
            document.getElementById('cookies').textContent = state.resources.cookies;

            // Upgrade buttons
            ['autoKataifi', 'autoPistachio', 'autoOven', 'price', 'speed'].forEach(type => {
                const lvl = state.upgrades[type];
                const base = CFG.balance.upgradeCosts[type];
                const mult = CFG.balance.upgradeMultipliers[type];
                const cost = Math.floor(base * Math.pow(mult, lvl));
                document.getElementById(`lv-${type}`).textContent = lvl;
                document.getElementById(`cost-${type}`).textContent = `₩${fmt(cost)}`;
                document.getElementById(`up-${type}`).disabled = state.money < cost;
            });

            // Buttons
            const c = CFG.balance.fillingCost;
            document.getElementById('btn-filling').disabled =
                state.resources.kataifi < c.kataifi || state.resources.pistachio < c.pistachio;
            document.getElementById('btn-bake').disabled = state.resources.filling < 1;
        }

        function fmt(n) {
            if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
            return Math.floor(n).toString();
        }

        function shake() {
            document.getElementById('game').classList.add('shake');
            setTimeout(() => document.getElementById('game').classList.remove('shake'), 300);
        }

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function floatText(text, color) {
            const div = document.createElement('div');
            div.className = 'float-text';
            div.textContent = text;
            div.style.color = color;
            div.style.left = canvas.width / 2 + 'px';
            div.style.top = canvas.height / 2 + 'px';
            document.getElementById('canvas-area').appendChild(div);
            setTimeout(() => div.remove(), 1500);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        // ============================================================================
        // SAVE/LOAD
        // ============================================================================
        function save() {
            localStorage.setItem('dujjonku', JSON.stringify({
                money: state.money,
                level: state.level,
                exp: state.exp,
                expNext: state.expNext,
                resources: state.resources,
                upgrades: state.upgrades,
                clickPower: state.clickPower,
                lastSave: Date.now()
            }));
        }

        function load() {
            const data = localStorage.getItem('dujjonku');
            if (data) {
                try {
                    const saved = JSON.parse(data);
                    Object.assign(state, saved);

                    const offline = Date.now() - saved.lastSave;
                    if (offline > 60000) {
                        const mins = Math.min(offline, 86400000) / 60000;
                        const earn = Math.floor(mins * state.level * 10 * 0.5);
                        if (earn > 0) {
                            document.getElementById('offline-earn').textContent = fmt(earn);
                            document.getElementById('offline-modal').classList.add('active');
                            window.pendingOffline = earn;
                        }
                    }

                    updateUI();
                } catch(e) {}
            }
        }

        function claimOffline() {
            state.money += window.pendingOffline || 0;
            document.getElementById('offline-modal').classList.remove('active');
            updateUI();
        }

        setInterval(save, 5000);
        window.addEventListener('beforeunload', save);

        // ============================================================================
        // INIT
        // ============================================================================
        load();
        updateUI();

        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
            gameLoop();
        }, 1000);

        // Prevent double-tap zoom
        let lastTouch = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTouch <= 300) e.preventDefault();
            lastTouch = now;
        }, { passive: false });

        document.addEventListener('contextmenu', e => e.preventDefault());

        console.log('🍪 두바이 쫀득 쿠키 타이쿤 시작!');
    </script>
</body>
</html>

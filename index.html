<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🍫 두바이 초콜릿 타이쿤</title>
    <style>
        :root {
            --chocolate: #2C1810;
            --chocolate-light: #5D4037;
            --kataifi: #FFD700;
            --pistachio: #4A7C2C;
            --pistachio-light: #7CB342;
            --dough: #D4A574;
            --gold: #FFD700;
            --bg: #1a1410;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: white;
            overflow: hidden;
            height: 100vh;
            touch-action: manipulation;
        }

        #app {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, var(--chocolate-light), var(--chocolate));
        }

        /* HUD */
        .hud {
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: bold;
        }

        .money { color: var(--gold); }

        /* Tab Navigation */
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.5);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .tab {
            flex: 1;
            padding: 12px 8px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: white;
            border-bottom-color: var(--gold);
            background: rgba(255,255,255,0.05);
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
        }

        .tab-content.active {
            display: block;
        }

        /* Canvas */
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            display: block;
        }

        /* Station Layout */
        .station-grid {
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: 100%;
        }

        .station {
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .station:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.1);
        }

        .station-icon {
            font-size: 48px;
            text-align: center;
        }

        .station-name {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .station-count {
            text-align: center;
            font-size: 20px;
            color: var(--gold);
            font-weight: bold;
        }

        .station-progress {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 3px;
            overflow: hidden;
        }

        .station-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--pistachio), var(--pistachio-light));
            transition: width 0.3s;
        }

        /* Assembly Area */
        .assembly-area {
            padding: 16px;
        }

        .chocolate-preview {
            background: var(--chocolate-light);
            border: 3px solid var(--gold);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .chocolate-layers {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            height: 200px;
            position: relative;
        }

        .layer {
            width: 100%;
            transition: height 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(0,0,0,0.5);
            font-weight: bold;
        }

        .layer-coating { background: var(--chocolate); color: white; }
        .layer-pistachio { background: var(--pistachio); color: white; }
        .layer-kataifi { background: var(--kataifi); }
        .layer-base { background: var(--dough); }

        .assembly-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--pistachio), var(--pistachio-light));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .assembly-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3);
        }

        .assembly-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Shop Layout */
        .shop-area {
            padding: 16px;
            height: 100%;
            overflow-y: auto;
        }

        .display-case {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .display-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--gold);
        }

        .chocolate-stock {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 80px;
            align-items: center;
            justify-content: center;
        }

        .chocolate-item {
            width: 40px;
            height: 60px;
            background: linear-gradient(180deg, var(--chocolate-light), var(--chocolate));
            border: 2px solid var(--kataifi);
            border-radius: 4px;
            position: relative;
            animation: popIn 0.3s;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .chocolate-item::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 4px;
            background: var(--pistachio);
            border-radius: 2px;
        }

        .customer-queue {
            margin-top: 16px;
        }

        .customer {
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .customer:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.1);
        }

        .customer-emoji {
            font-size: 40px;
        }

        .customer-info {
            flex: 1;
        }

        .customer-name {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .patience-bar {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 3px;
            overflow: hidden;
        }

        .patience-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ffd700, #4ecca3);
            transition: width 0.3s;
        }

        /* Upgrades */
        .upgrade-list {
            padding: 16px;
        }

        .upgrade-item {
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .upgrade-item:active {
            transform: scale(0.98);
        }

        .upgrade-item.locked {
            opacity: 0.5;
        }

        .upgrade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .upgrade-name {
            font-weight: bold;
            font-size: 16px;
        }

        .upgrade-level {
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
        }

        .upgrade-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
        }

        .upgrade-cost {
            font-size: 14px;
            color: var(--gold);
            font-weight: bold;
        }

        /* Floating Numbers */
        .float-num {
            position: fixed;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 1.5s forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--chocolate-light);
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            max-width: 90%;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 28px;
            color: var(--gold);
            margin-bottom: 16px;
        }

        .modal-text {
            font-size: 18px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-btn {
            padding: 16px 32px;
            background: var(--gold);
            border: none;
            border-radius: 12px;
            color: var(--chocolate);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Loading */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--chocolate);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-icon {
            font-size: 80px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 24px;
            color: var(--gold);
            margin-top: 20px;
        }

        /* Scrollbar */
        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }

        .content::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-icon">🍫</div>
        <div class="loading-text">두바이 초콜릿 로딩 중...</div>
    </div>

    <div id="app">
        <div class="hud">
            <div class="hud-item money">💰 <span id="money">0</span></div>
            <div class="hud-item">Lv. <span id="level">1</span></div>
            <div class="hud-item">⭐ <span id="reputation">0</span></div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab(0)">🍳 재료실</button>
            <button class="tab" onclick="switchTab(1)">🏭 제조실</button>
            <button class="tab" onclick="switchTab(2)">🏪 판매장</button>
            <button class="tab" onclick="switchTab(3)">⬆️ 업그레이드</button>
        </div>

        <div class="content">
            <!-- Tab 0: Ingredients -->
            <div id="tab-0" class="tab-content active">
                <div class="station-grid">
                    <div class="station" onclick="harvestKataifi()">
                        <div class="station-icon">🌾</div>
                        <div class="station-name">카다이프 볶기</div>
                        <div class="station-count" id="kataifi-count">0</div>
                        <div class="station-progress">
                            <div class="station-progress-bar" id="kataifi-progress" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="station" onclick="crushPistachio()">
                        <div class="station-icon">🥜</div>
                        <div class="station-name">피스타치오 분쇄</div>
                        <div class="station-count" id="pistachio-count">0</div>
                        <div class="station-progress">
                            <div class="station-progress-bar" id="pistachio-progress" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="station" onclick="mixSpread()">
                        <div class="station-icon">🍯</div>
                        <div class="station-name">스프레드 제조</div>
                        <div class="station-count" id="spread-count">0</div>
                        <div class="station-progress">
                            <div class="station-progress-bar" id="spread-progress" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="station" onclick="bakeDough()">
                        <div class="station-icon">🍪</div>
                        <div class="station-name">도우 베이킹</div>
                        <div class="station-count" id="dough-count">0</div>
                        <div class="station-progress">
                            <div class="station-progress-bar" id="dough-progress" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab 1: Assembly -->
            <div id="tab-1" class="tab-content">
                <div class="assembly-area">
                    <div class="chocolate-preview">
                        <div class="chocolate-layers" id="preview-layers">
                            <div class="layer layer-coating" id="layer-coating" style="height: 20%">초콜릿 코팅</div>
                            <div class="layer layer-pistachio" id="layer-pistachio" style="height: 30%">피스타치오</div>
                            <div class="layer layer-kataifi" id="layer-kataifi" style="height: 30%">카다이프</div>
                            <div class="layer layer-base" id="layer-base" style="height: 20%">쿠키 베이스</div>
                        </div>
                    </div>

                    <div style="font-size: 14px; margin-bottom: 12px; color: rgba(255,255,255,0.7);">
                        필요: 🍪베이스 1 + 🌾카다이프 3 + 🍯스프레드 1
                    </div>

                    <button class="assembly-btn" onclick="assembleChocolate()" id="assemble-btn">
                        🏭 초콜릿 조립하기
                    </button>

                    <div style="text-align: center; font-size: 18px; font-weight: bold; color: var(--gold);">
                        완성품: <span id="finished-count">0</span>개
                    </div>
                </div>
            </div>

            <!-- Tab 2: Shop -->
            <div id="tab-2" class="tab-content">
                <div class="shop-area">
                    <div class="display-case">
                        <div class="display-title">🍫 진열대</div>
                        <div class="chocolate-stock" id="chocolate-display"></div>
                    </div>

                    <div class="customer-queue">
                        <div class="display-title">👥 손님 대기열</div>
                        <div id="customer-list"></div>
                    </div>
                </div>
            </div>

            <!-- Tab 3: Upgrades -->
            <div id="tab-3" class="tab-content">
                <div class="upgrade-list" id="upgrade-list"></div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="offline-modal">
        <div class="modal-content">
            <div class="modal-title">💰 오프라인 수익</div>
            <div class="modal-text">
                알바생이 <span id="offline-earn" style="color: var(--gold);">0</span>원을 벌었습니다!
            </div>
            <button class="modal-btn" onclick="claimOffline()">받기</button>
        </div>
    </div>

    <div class="modal" id="achievement-modal">
        <div class="modal-content">
            <div class="modal-title">🏆 업적 달성!</div>
            <div class="modal-text" id="achievement-text"></div>
            <button class="modal-btn" onclick="closeAchievement()">확인</button>
        </div>
    </div>

    <script>
        "use strict";

        // ============================================================================
        // GAME CONFIG
        // ============================================================================
        const CONFIG = {
            balance: {
                chocolatePrice: 5000,
                assemblyRequires: { dough: 1, kataifi: 3, spread: 1 },
                spreadRequires: { pistachio: 5 },
                harvestBase: { kataifi: 1, pistachio: 1, dough: 1, spread: 1 },
                customerSpawnInterval: 3000,
                customerPatience: 20000
            },
            upgrades: [
                { id: 'autoKataifi', name: '🤖 자동 카다이프', desc: '초당 +1 생산', baseCost: 1000, mult: 1.5, effect: 'autoKataifi' },
                { id: 'autoPistachio', name: '🤖 자동 피스타치오', desc: '초당 +1 생산', baseCost: 1500, mult: 1.5, effect: 'autoPistachio' },
                { id: 'autoSpread', name: '🤖 자동 스프레드', desc: '초당 +1 생산', baseCost: 2500, mult: 1.6, effect: 'autoSpread' },
                { id: 'autoDough', name: '🤖 자동 도우', desc: '초당 +1 생산', baseCost: 2000, mult: 1.5, effect: 'autoDough' },
                { id: 'autoAssembly', name: '🏭 자동 조립', desc: '자동으로 조립', baseCost: 10000, mult: 2.0, effect: 'autoAssembly' },
                { id: 'clickPower', name: '💪 클릭 파워', desc: '클릭당 +1', baseCost: 500, mult: 1.4, effect: 'clickPower' },
                { id: 'price', name: '💰 판매가 상승', desc: '가격 +25%', baseCost: 3000, mult: 1.5, effect: 'priceBoost' },
                { id: 'customerSpeed', name: '⚡ 손님 속도', desc: '스폰 속도 +20%', baseCost: 2500, mult: 1.4, effect: 'customerSpeed' },
                { id: 'quality', name: '⭐ 품질 개선', desc: '평판 획득 +50%', baseCost: 5000, mult: 1.6, effect: 'qualityBoost' },
                { id: 'efficiency', name: '⚙️ 효율 향상', desc: '재료 소모 -10%', baseCost: 8000, mult: 1.7, effect: 'efficiency' }
            ]
        };

        // ============================================================================
        // GAME STATE
        // ============================================================================
        const state = {
            money: 0,
            level: 1,
            exp: 0,
            expNext: 1000,
            reputation: 0,

            resources: {
                kataifi: 0,
                pistachio: 0,
                spread: 0,
                dough: 0,
                finished: 0
            },

            upgrades: {},

            customers: [],

            autoProduction: {
                kataifi: 0,
                pistachio: 0,
                spread: 0,
                dough: 0,
                assembly: 0
            },

            clickPower: 1,
            priceMultiplier: 1,
            qualityMultiplier: 1,
            efficiencyMultiplier: 1,

            lastSave: Date.now(),
            achievements: []
        };

        // Initialize upgrades
        CONFIG.upgrades.forEach(u => state.upgrades[u.id] = 0);

        // ============================================================================
        // AUDIO ENGINE
        // ============================================================================
        class Audio {
            constructor() {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();
                    this.gain = this.ctx.createGain();
                    this.gain.gain.value = 0.3;
                    this.gain.connect(this.ctx.destination);
                } catch(e) {
                    this.ctx = null;
                }
            }

            play(type) {
                if (!this.ctx) return;
                this.ctx.resume();

                const sounds = {
                    click: () => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.type = 'sine';
                        o.frequency.value = 800;
                        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                        o.connect(g);
                        g.connect(this.gain);
                        o.start();
                        o.stop(this.ctx.currentTime + 0.1);
                    },
                    crunch: () => {
                        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.15, this.ctx.sampleRate);
                        const data = buf.getChannelData(0);
                        for (let i = 0; i < data.length; i++) {
                            if (Math.random() > 0.7) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
                        }
                        const src = this.ctx.createBufferSource();
                        src.buffer = buf;
                        const filt = this.ctx.createBiquadFilter();
                        filt.type = 'highpass';
                        filt.frequency.value = 2000;
                        const g = this.ctx.createGain();
                        g.gain.value = 0.15;
                        src.connect(filt);
                        filt.connect(g);
                        g.connect(this.gain);
                        src.start();
                    },
                    coin: () => {
                        [1047, 1319, 1568].forEach((f, i) => {
                            setTimeout(() => {
                                const o = this.ctx.createOscillator();
                                const g = this.ctx.createGain();
                                o.frequency.value = f;
                                g.gain.setValueAtTime(0.12, this.ctx.currentTime);
                                g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                                o.connect(g);
                                g.connect(this.gain);
                                o.start();
                                o.stop(this.ctx.currentTime + 0.2);
                            }, i * 70);
                        });
                    },
                    success: () => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.type = 'sine';
                        o.frequency.setValueAtTime(1200, this.ctx.currentTime);
                        o.frequency.exponentialRampToValueAtTime(1800, this.ctx.currentTime + 0.15);
                        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                        o.connect(g);
                        g.connect(this.gain);
                        o.start();
                        o.stop(this.ctx.currentTime + 0.15);
                    },
                    levelup: () => {
                        [523, 659, 784, 1047].forEach((f, i) => {
                            setTimeout(() => {
                                const o = this.ctx.createOscillator();
                                const g = this.ctx.createGain();
                                o.type = 'square';
                                o.frequency.value = f;
                                g.gain.setValueAtTime(0.1, this.ctx.currentTime);
                                g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                                o.connect(g);
                                g.connect(this.gain);
                                o.start();
                                o.stop(this.ctx.currentTime + 0.2);
                            }, i * 90);
                        });
                    }
                };

                if (sounds[type]) sounds[type]();
            }
        }

        const audio = new Audio();

        // ============================================================================
        // GAME ACTIONS
        // ============================================================================
        function harvestKataifi() {
            state.resources.kataifi += CONFIG.balance.harvestBase.kataifi * state.clickPower;
            audio.play('crunch');
            animateProgress('kataifi');
            updateUI();
        }

        function crushPistachio() {
            state.resources.pistachio += CONFIG.balance.harvestBase.pistachio * state.clickPower;
            audio.play('crunch');
            animateProgress('pistachio');
            updateUI();
        }

        function mixSpread() {
            const req = CONFIG.balance.spreadRequires.pistachio * state.efficiencyMultiplier;
            if (state.resources.pistachio >= req) {
                state.resources.pistachio -= Math.floor(req);
                state.resources.spread += CONFIG.balance.harvestBase.spread * state.clickPower;
                audio.play('click');
                animateProgress('spread');
                updateUI();
            }
        }

        function bakeDough() {
            state.resources.dough += CONFIG.balance.harvestBase.dough * state.clickPower;
            audio.play('click');
            animateProgress('dough');
            updateUI();
        }

        function assembleChocolate() {
            const req = CONFIG.balance.assemblyRequires;
            const mult = state.efficiencyMultiplier;

            const needs = {
                dough: Math.floor(req.dough * mult),
                kataifi: Math.floor(req.kataifi * mult),
                spread: Math.floor(req.spread * mult)
            };

            if (state.resources.dough >= needs.dough &&
                state.resources.kataifi >= needs.kataifi &&
                state.resources.spread >= needs.spread) {

                state.resources.dough -= needs.dough;
                state.resources.kataifi -= needs.kataifi;
                state.resources.spread -= needs.spread;
                state.resources.finished++;

                audio.play('success');
                updateUI();
                updateChocolateDisplay();
            }
        }

        function sellChocolate(customer) {
            if (state.resources.finished > 0) {
                state.resources.finished--;

                const basePrice = CONFIG.balance.chocolatePrice;
                const price = Math.floor(basePrice * state.level * state.priceMultiplier);
                const rep = Math.floor(10 * state.qualityMultiplier);

                state.money += price;
                state.reputation += rep;
                state.exp += price * 0.1;

                customer.satisfied = true;
                audio.play('coin');
                floatNumber(`+${fmt(price)}`, customer.x, customer.y, '#FFD700');

                setTimeout(() => {
                    const idx = state.customers.indexOf(customer);
                    if (idx > -1) state.customers.splice(idx, 1);
                    updateCustomerUI();
                }, 500);

                if (state.exp >= state.expNext) levelUp();
                updateUI();
                updateChocolateDisplay();
            }
        }

        function levelUp() {
            state.level++;
            state.exp = 0;
            state.expNext = Math.floor(state.expNext * 1.5);
            state.clickPower++;
            audio.play('levelup');
            showAchievement(`레벨 ${state.level} 달성!`);
        }

        // ============================================================================
        // UPGRADES
        // ============================================================================
        function buyUpgrade(upgradeId) {
            const upgrade = CONFIG.upgrades.find(u => u.id === upgradeId);
            if (!upgrade) return;

            const level = state.upgrades[upgradeId];
            const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.mult, level));

            if (state.money >= cost) {
                state.money -= cost;
                state.upgrades[upgradeId]++;

                // Apply effect
                applyUpgradeEffect(upgrade.effect);

                audio.play('coin');
                updateUI();
                updateUpgradeList();
            }
        }

        function applyUpgradeEffect(effect) {
            if (effect === 'autoKataifi') state.autoProduction.kataifi++;
            else if (effect === 'autoPistachio') state.autoProduction.pistachio++;
            else if (effect === 'autoSpread') state.autoProduction.spread++;
            else if (effect === 'autoDough') state.autoProduction.dough++;
            else if (effect === 'autoAssembly') state.autoProduction.assembly++;
            else if (effect === 'clickPower') state.clickPower++;
            else if (effect === 'priceBoost') state.priceMultiplier *= 1.25;
            else if (effect === 'customerSpeed') {}  // Handled in spawn logic
            else if (effect === 'qualityBoost') state.qualityMultiplier *= 1.5;
            else if (effect === 'efficiency') state.efficiencyMultiplier *= 0.9;
        }

        function updateUpgradeList() {
            const list = document.getElementById('upgrade-list');
            list.innerHTML = '';

            CONFIG.upgrades.forEach(upgrade => {
                const level = state.upgrades[upgrade.id];
                const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.mult, level));
                const canAfford = state.money >= cost;

                const div = document.createElement('div');
                div.className = `upgrade-item ${canAfford ? '' : 'locked'}`;
                div.innerHTML = `
                    <div class="upgrade-header">
                        <div class="upgrade-name">${upgrade.name}</div>
                        <div class="upgrade-level">Lv ${level}</div>
                    </div>
                    <div class="upgrade-desc">${upgrade.desc}</div>
                    <div class="upgrade-cost">₩${fmt(cost)}</div>
                `;
                div.onclick = () => buyUpgrade(upgrade.id);
                list.appendChild(div);
            });
        }

        // ============================================================================
        // AUTO PRODUCTION
        // ============================================================================
        setInterval(() => {
            // Auto harvest
            if (state.autoProduction.kataifi > 0) {
                state.resources.kataifi += state.autoProduction.kataifi;
            }
            if (state.autoProduction.pistachio > 0) {
                state.resources.pistachio += state.autoProduction.pistachio;
            }
            if (state.autoProduction.dough > 0) {
                state.resources.dough += state.autoProduction.dough;
            }

            // Auto spread
            if (state.autoProduction.spread > 0) {
                const req = CONFIG.balance.spreadRequires.pistachio * state.efficiencyMultiplier;
                if (state.resources.pistachio >= req * state.autoProduction.spread) {
                    state.resources.pistachio -= Math.floor(req * state.autoProduction.spread);
                    state.resources.spread += state.autoProduction.spread;
                }
            }

            // Auto assembly
            if (state.autoProduction.assembly > 0) {
                const req = CONFIG.balance.assemblyRequires;
                const mult = state.efficiencyMultiplier;
                const needs = {
                    dough: Math.floor(req.dough * mult * state.autoProduction.assembly),
                    kataifi: Math.floor(req.kataifi * mult * state.autoProduction.assembly),
                    spread: Math.floor(req.spread * mult * state.autoProduction.assembly)
                };

                if (state.resources.dough >= needs.dough &&
                    state.resources.kataifi >= needs.kataifi &&
                    state.resources.spread >= needs.spread) {

                    state.resources.dough -= needs.dough;
                    state.resources.kataifi -= needs.kataifi;
                    state.resources.spread -= needs.spread;
                    state.resources.finished += state.autoProduction.assembly;

                    updateChocolateDisplay();
                }
            }

            updateUI();
        }, 1000);

        // ============================================================================
        // CUSTOMERS
        // ============================================================================
        setInterval(() => {
            const speedBonus = 1 + (state.upgrades.customerSpeed || 0) * 0.2;
            const interval = CONFIG.balance.customerSpawnInterval / speedBonus;

            if (Math.random() < 1000 / interval && state.customers.length < 5) {
                const names = ['김민수', '이영희', '박철수', '최지영', '정대호', '강수진'];
                state.customers.push({
                    name: names[Math.floor(Math.random() * names.length)],
                    patience: CONFIG.balance.customerPatience,
                    maxPatience: CONFIG.balance.customerPatience,
                    satisfied: false,
                    x: Math.random() * 300 + 50,
                    y: Math.random() * 100 + 100
                });
                updateCustomerUI();
            }
        }, 100);

        function updateCustomers() {
            state.customers.forEach((c, i) => {
                c.patience -= 16;
                if (c.patience <= 0 && !c.satisfied) {
                    state.customers.splice(i, 1);
                    updateCustomerUI();
                }
            });
        }

        setInterval(updateCustomers, 16);

        function updateCustomerUI() {
            const list = document.getElementById('customer-list');
            list.innerHTML = '';

            state.customers.forEach(c => {
                const pct = Math.max(0, c.patience / c.maxPatience * 100);
                const emoji = c.satisfied ? '😊' : (pct < 30 ? '😠' : pct < 60 ? '😐' : '🙂');

                const div = document.createElement('div');
                div.className = 'customer';
                div.innerHTML = `
                    <div class="customer-emoji">${emoji}</div>
                    <div class="customer-info">
                        <div class="customer-name">${c.name}</div>
                        <div class="patience-bar">
                            <div class="patience-fill" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
                div.onclick = () => sellChocolate(c);
                list.appendChild(div);
            });
        }

        // ============================================================================
        // UI UPDATES
        // ============================================================================
        function updateUI() {
            document.getElementById('money').textContent = fmt(state.money);
            document.getElementById('level').textContent = state.level;
            document.getElementById('reputation').textContent = fmt(state.reputation);

            document.getElementById('kataifi-count').textContent = state.resources.kataifi;
            document.getElementById('pistachio-count').textContent = state.resources.pistachio;
            document.getElementById('spread-count').textContent = state.resources.spread;
            document.getElementById('dough-count').textContent = state.resources.dough;
            document.getElementById('finished-count').textContent = state.resources.finished;

            // Assembly button
            const req = CONFIG.balance.assemblyRequires;
            const mult = state.efficiencyMultiplier;
            const canAssemble = state.resources.dough >= Math.floor(req.dough * mult) &&
                               state.resources.kataifi >= Math.floor(req.kataifi * mult) &&
                               state.resources.spread >= Math.floor(req.spread * mult);
            document.getElementById('assemble-btn').disabled = !canAssemble;
        }

        function updateChocolateDisplay() {
            const display = document.getElementById('chocolate-display');
            display.innerHTML = '';

            const count = Math.min(state.resources.finished, 20);
            for (let i = 0; i < count; i++) {
                const div = document.createElement('div');
                div.className = 'chocolate-item';
                display.appendChild(div);
            }

            if (state.resources.finished > 20) {
                const more = document.createElement('div');
                more.style.fontSize = '24px';
                more.style.fontWeight = 'bold';
                more.textContent = `+${state.resources.finished - 20}`;
                display.appendChild(more);
            }
        }

        function animateProgress(type) {
            const bar = document.getElementById(`${type}-progress`);
            bar.style.width = '100%';
            setTimeout(() => bar.style.width = '0%', 300);
        }

        function fmt(n) {
            if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
            return Math.floor(n).toString();
        }

        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });

            if (index === 3) updateUpgradeList();
        }

        function floatNumber(text, x, y, color) {
            const div = document.createElement('div');
            div.className = 'float-num';
            div.textContent = text;
            div.style.color = color;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1500);
        }

        function showAchievement(text) {
            document.getElementById('achievement-text').textContent = text;
            document.getElementById('achievement-modal').classList.add('active');
            setTimeout(() => {
                document.getElementById('achievement-modal').classList.remove('active');
            }, 2000);
        }

        function closeAchievement() {
            document.getElementById('achievement-modal').classList.remove('active');
        }

        // ============================================================================
        // SAVE/LOAD
        // ============================================================================
        function save() {
            localStorage.setItem('dubai_choco', JSON.stringify({
                money: state.money,
                level: state.level,
                exp: state.exp,
                expNext: state.expNext,
                reputation: state.reputation,
                resources: state.resources,
                upgrades: state.upgrades,
                autoProduction: state.autoProduction,
                clickPower: state.clickPower,
                priceMultiplier: state.priceMultiplier,
                qualityMultiplier: state.qualityMultiplier,
                efficiencyMultiplier: state.efficiencyMultiplier,
                lastSave: Date.now()
            }));
        }

        function load() {
            const saved = localStorage.getItem('dubai_choco');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    Object.assign(state, data);

                    const offline = Date.now() - data.lastSave;
                    if (offline > 60000) {
                        const mins = Math.min(offline, 86400000) / 60000;
                        const earn = Math.floor(mins * state.level * state.autoProduction.assembly * 100);
                        if (earn > 0) {
                            document.getElementById('offline-earn').textContent = fmt(earn);
                            document.getElementById('offline-modal').classList.add('active');
                            window.pendingOffline = earn;
                        }
                    }

                    updateUI();
                    updateChocolateDisplay();
                } catch(e) {}
            }
        }

        function claimOffline() {
            state.money += window.pendingOffline || 0;
            document.getElementById('offline-modal').classList.remove('active');
            updateUI();
        }

        setInterval(save, 5000);
        window.addEventListener('beforeunload', save);

        // ============================================================================
        // INIT
        // ============================================================================
        load();
        updateUI();
        updateUpgradeList();

        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 1000);

        // Prevent double-tap zoom
        let lastTouch = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTouch <= 300) e.preventDefault();
            lastTouch = now;
        }, { passive: false });

        document.addEventListener('contextmenu', e => e.preventDefault());

        console.log('🍫 두바이 초콜릿 타이쿤 시작!');
    </script>
</body>
</html>
